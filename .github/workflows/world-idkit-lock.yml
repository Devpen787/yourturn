name: World IDKit lockfile sync

on:
  push:
    branches:
      - 'feature/ethonline-world-sandbox-proof'
    paths:
      - 'package.json'
      - '.github/workflows/world-idkit-lock.yml'

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sandbox proof branch
        uses: actions/checkout@v4
        with:
          ref: feature/ethonline-world-sandbox-proof
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate lockfile only
        run: npm install --package-lock-only --save-exact --legacy-peer-deps --ignore-scripts @worldcoin/idkit@4.2.3

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build(world): lock IDKit 4.2.3'
          git push origin HEAD:feature/ethonline-world-sandbox-proof
