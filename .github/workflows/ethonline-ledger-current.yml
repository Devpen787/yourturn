name: Ledger current mandate runtime
on:
  push:
    branches: [feature/ethonline-ledger-current-qual, feature/ethonline-ledger-operation-qual]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-mandate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.2
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Existing authority and replay checks
        run: node --experimental-strip-types scripts/ledger-recovery-mandate-runtime-check.mjs
      - name: Real Redis current-pointer races and replacement
        run: node --experimental-strip-types scripts/ledger-current-mandate-check.mjs
      - name: Real Redis operation claim, resume and effect fencing
        run: node --experimental-strip-types scripts/ledger-operation-mandate-check.mjs
