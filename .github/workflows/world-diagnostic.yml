name: World verifier diagnostic

on:
  push:
    branches:
      - feature/ethonline-world
    paths:
      - '.github/workflows/world-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ethonline-world
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Capture World verifier output
        id: check
        continue-on-error: true
        shell: bash
        run: npm run world:contract-check > /tmp/world-check.log 2>&1
      - name: Commit diagnostic output
        if: always()
        shell: bash
        run: |
          cp /tmp/world-check.log docs/ethonline-2026/world-ci-diagnostic.txt
          printf '\nexit_outcome=%s\n' '${{ steps.check.outcome }}' >> docs/ethonline-2026/world-ci-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ethonline-2026/world-ci-diagnostic.txt
          git commit -m 'chore(world): capture verifier diagnostic' || exit 0
          git push origin HEAD:feature/ethonline-world
