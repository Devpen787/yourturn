name: Product Workbench Truth Check

# Detects phase / candidate / Golden / next-gate drift across the canonical
# Product Workbench documents.
#
# ORDERING REQUIREMENT: this workflow reads the pw-state markers introduced by
# `audit/workbench-truth-sync`. Merge that branch first (or together with this
# one), otherwise every canonical document will correctly report a missing
# marker.
#
# Deliberately does not build, install or render. Docs drift must be cheap to
# catch, so this runs on docs-only changes in seconds with no dependencies.

on:
  push:
    paths:
      - 'docs/product-workbench/**'
      - 'scripts/product-workbench-truth-check.mjs'
      - '.github/workflows/product-workbench-truth.yml'
  pull_request:
    paths:
      - 'docs/product-workbench/**'
      - 'scripts/product-workbench-truth-check.mjs'
      - '.github/workflows/product-workbench-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Product Workbench truth check
        run: node scripts/product-workbench-truth-check.mjs
