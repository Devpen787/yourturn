name: World AgentBook Live Proof

on:
  workflow_dispatch:
    inputs:
      agent_address:
        description: "Public EVM address already registered through AgentBook + World ID"
        required: true
        type: string
  push:
    branches:
      - 'feature/ethonline-world'
    paths:
      - '.github/workflows/world-agentbook-proof.yml'

permissions:
  contents: read

jobs:
  agentbook-live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout World branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Match the repo's existing Continuity CI because the immutable
        # baseline lockfile contains a known peer-range conflict.
        run: npm ci --legacy-peer-deps

      - name: Resolve agent through canonical AgentBook verifier
        env:
          WORLD_AGENT_ADDRESS: ${{ github.event.inputs.agent_address || '0xef1c84eab9cc74bcbae321b75cf2d916ee329163' }}
        run: |
          set -o pipefail
          npm run world:agentbook-live-check 2>&1 | tee world-agentbook-proof.json

      - name: Upload privacy-safe proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-agentbook-live-proof
          path: world-agentbook-proof.json
          if-no-files-found: error
          retention-days: 14
