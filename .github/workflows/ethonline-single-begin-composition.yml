name: Finish-line software qualification
on:
  push:
    branches:
      - feature/chatgpt-finishline-continuation
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Single-begin seam checks
        run: node --experimental-transform-types scripts/single-begin-composition-check.mjs
      - name: Business eligibility source checks
        run: node --experimental-transform-types scripts/current-business-eligibility-check.mjs
      - name: Public enrollment provisioning checks
        run: node --experimental-transform-types scripts/public-enrollment-provisioning-check.mjs
      - name: Durable payment authorization checks
        run: node --experimental-transform-types scripts/current-payment-authorization-check.mjs
      - name: Existing prepare-retain model regression
        run: node --experimental-transform-types scripts/hedera-prepare-retain-check.mjs --model
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
