name: ETHOnline Hedera External Signing Validation
on:
  push:
    branches: ['feature/ethonline-hedera-signing-boundary-qual']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.2
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Locked install
        run: npm ci --legacy-peer-deps
      - name: Exact signing boundary synthetic cases
        run: env -i PATH="$PATH" NODE_OPTIONS=--no-warnings node --experimental-transform-types scripts/hedera-external-signing-check.mjs
      - name: Existing semantic and royalty checks
        run: |
          env -i PATH="$PATH" NODE_OPTIONS=--no-warnings node --experimental-transform-types scripts/hedera-policy-usdc-recovery-check.mjs
          env -i PATH="$PATH" NODE_OPTIONS=--no-warnings node --experimental-transform-types scripts/hedera-recovery-royalty-check.mjs
          env -i PATH="$PATH" NODE_OPTIONS=--no-warnings node --experimental-transform-types scripts/hedera-royalty-authorization-check.mjs
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Read existing tombstones through default adapter and actual disposable Redis
        run: env -i PATH="$PATH" NODE_OPTIONS=--no-warnings YT_SOURCE_SHA="${{ github.sha }}" YT_TEST_REDIS_PORT=16379 node --experimental-transform-types scripts/hedera-signing-redis-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hedera-signing-validation-${{ github.sha }}
          path: hedera-signing-redis-evidence.json
          if-no-files-found: error
          retention-days: 30
