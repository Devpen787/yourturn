name: Ledger operation-owned authority
on:
  push:
    branches: [feature/ethonline-ledger-owned-loader-qual]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.2
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Operation-owned read boundaries
        run: env -i PATH="$PATH" NODE_OPTIONS=--no-warnings node --experimental-transform-types scripts/ledger-owned-authority-check.mjs
      - run: npx tsc --noEmit --incremental false
      - name: Existing Ledger and canonical contracts
        run: |
          env -i PATH="$PATH" NODE_OPTIONS=--no-warnings node --experimental-strip-types scripts/ledger-recovery-mandate-runtime-check.mjs
          env -i PATH="$PATH" NODE_OPTIONS=--no-warnings node --experimental-strip-types scripts/ledger-current-mandate-check.mjs
          env -i PATH="$PATH" NODE_OPTIONS=--no-warnings node --experimental-strip-types scripts/ledger-operation-mandate-check.mjs
          env -i PATH="$PATH" NODE_OPTIONS=--no-warnings node --experimental-strip-types scripts/canonical-recovery-projection-check.mjs
      - name: Actual claim-to-owned-read-to-effect-to-receipt state flow
        run: env -i PATH="$PATH" NODE_OPTIONS=--no-warnings YT_SOURCE_SHA="${{ github.sha }}" node --experimental-transform-types scripts/ledger-owned-authority-redis-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-owned-authority-${{ github.sha }}
          path: ledger-owned-authority-evidence.json
          if-no-files-found: error
          retention-days: 30
