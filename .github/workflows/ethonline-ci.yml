name: ETHOnline Continuity Gate

on:
  push:
    branches:
      - 'feature/ethonline-*'
  pull_request:

permissions:
  contents: read

jobs:
  continuity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Production build
        run: npm run build

      - name: Hedera Agent Kit policy/proof check
        env:
          HEDERA_GUEST_A_ID: '0.0.9001'
          HEDERA_TREASURY_ID: '0.0.9002'
        run: npm run hedera:agent-check

      - name: Ledger Recovery Mandate contract check
        run: npm run ledger:mandate-check

      - name: SEC-LEDGER-006 positive guarded load
        run: node --experimental-transform-types scripts/security-ledger-006-retest.mjs positive

      - name: SEC-LEDGER-006 post-activation serialized mutation
        run: node --experimental-transform-types scripts/security-ledger-006-retest.mjs post-mutation

      - name: SEC-LEDGER-006 mutation during revalidation
        run: node --experimental-transform-types scripts/security-ledger-006-retest.mjs during-revalidation

      - name: SEC-LEDGER-006 odd in-flight version
        run: node --experimental-transform-types scripts/security-ledger-006-retest.mjs odd-version

      - name: SEC-LEDGER-006 missing authority context
        run: node --experimental-transform-types scripts/security-ledger-006-retest.mjs missing-context

      - name: SEC-LEDGER-006 live holder status policy listing drift
        run: node --experimental-transform-types scripts/security-ledger-006-retest.mjs live-drift

      - name: SEC-LEDGER-006 one-shot replay preserved
        run: node --experimental-transform-types scripts/security-ledger-006-retest.mjs replay

      - name: Ledger DMK device ceremony contract check
        run: node scripts/ledger-device-proof/ceremony-check.mjs

      - name: Ledger current DMK Node-HID import smoke
        working-directory: scripts/ledger-device-proof
        run: |
          npm install --no-package-lock --legacy-peer-deps
          npm run proof -- --help

      - name: Continuity baseline must remain documented
        run: |
          grep -q 'd0b5f875afb4f2b29af29bc5972cf1edc404d473' docs/ethonline-2026/CONTINUITY_BASELINE.md
          test -f docs/ethonline-2026/ACCEPTANCE.json
          test -f docs/ethonline-2026/progress.md
