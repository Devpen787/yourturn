name: ETHOnline Continuity Gate

on:
  push:
    branches:
      - 'feature/ethonline-*'
  pull_request:

permissions:
  contents: read

jobs:
  continuity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 can execute the repo's erasable TypeScript imports used by
          # scripts/hedera-agent-check.mjs without adding a new loader or
          # mutating the June dependency baseline. It also satisfies current
          # wallet-standard engine requirements that warn on Node 20.
          node-version: 22
          cache: npm

      - name: Install
        # Baseline repo currently has a peer-range conflict between
        # hedera-wallet-connect 2.1.3 (@hiero-ledger/sdk 2.79.0) and
        # Hedera Agent Kit v4 (@hiero-ledger/sdk ^2.81.0). Preserve the
        # existing lockfile/runtime for the continuity baseline instead of
        # changing dependencies in the process-only foundation PR.
        run: npm ci --legacy-peer-deps

      - name: Production build
        run: npm run build

      - name: Hedera Agent Kit policy/proof check
        # The baseline checker validates the configured wallet-allowance policy.
        # CI has no demo-account secrets, so use explicit non-secret fixture IDs.
        # No allowance tx id is set, therefore this remains CONFIGURED evidence,
        # never LIVE/TESTNET evidence.
        env:
          HEDERA_GUEST_A_ID: '0.0.9001'
          HEDERA_TREASURY_ID: '0.0.9002'
        run: npm run hedera:agent-check

      - name: World AgentKit trust-boundary contract check
        run: npm run world:contract-check

      - name: World recovery write gate adversarial check
        run: npm run world:recovery-write-check

      - name: World signed recovery live-proof runner self-test
        # Offline fixture only: validates exact-resource AgentKit signing and
        # verification without pretending to be LIVE/AGENTBOOK or a live write.
        run: npm run world:recovery-live-proof:self-test

      - name: World ID Sandbox proof harness contract check
        # Static/CI contract only. No RP private key is present in Actions, and
        # this must not be promoted to Sandbox proof until the real phone round
        # trip and backend verification succeed.
        run: npm run world:sandbox-check

      - name: Independent World Sandbox loopback-boundary attack
        # Attacker-only integration reproducer. No RP key is configured and no
        # World request is signed; this exercises the built Next.js route with
        # a spoofed loopback Host plus explicitly remote forwarding metadata.
        run: node scripts/security-world-sandbox-loopback-bypass.mjs

      - name: Continuity baseline must remain documented
        run: |
          grep -q 'd0b5f875afb4f2b29af29bc5972cf1edc404d473' docs/ethonline-2026/CONTINUITY_BASELINE.md
          test -f docs/ethonline-2026/ACCEPTANCE.json
          test -f docs/ethonline-2026/progress.md
