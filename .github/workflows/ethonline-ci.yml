name: ETHOnline Continuity Gate

on:
  push:
    branches:
      - 'feature/ethonline-*'
  pull_request:

permissions:
  contents: read

jobs:
  continuity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 can execute the repo's erasable TypeScript imports used by
          # scripts/hedera-agent-check.mjs without adding a new loader or
          # mutating the June dependency baseline. It also satisfies current
          # wallet-standard engine requirements that warn on Node 20.
          node-version: 22
          cache: npm

      - name: Install
        # Baseline repo currently has a peer-range conflict between
        # hedera-wallet-connect 2.1.3 (@hiero-ledger/sdk 2.79.0) and
        # Hedera Agent Kit v4 (@hiero-ledger/sdk ^2.81.0). Preserve the
        # existing lockfile/runtime for the continuity baseline instead of
        # changing dependencies in the process-only foundation PR.
        run: npm ci --legacy-peer-deps

      - name: Production build
        run: npm run build

      - name: Hedera Agent Kit policy/proof check
        # The baseline checker validates the configured wallet-allowance policy.
        # CI has no demo-account secrets, so use explicit non-secret fixture IDs.
        # No allowance tx id is set, therefore this remains CONFIGURED evidence,
        # never LIVE/TESTNET evidence.
        env:
          HEDERA_GUEST_A_ID: '0.0.9001'
          HEDERA_TREASURY_ID: '0.0.9002'
        run: npm run hedera:agent-check

      - name: Hedera serial-scoped NFT delegation check
        # Deterministic transaction-shape proof only. It must stay clearly below
        # LIVE/TESTNET evidence until the same lifecycle executes on Hedera.
        run: npm run hedera:nft-delegation-proof

      - name: Hedera Agent Kit delegated recovery RETURN_BYTES check
        # ETHOnline-new HAK surface. It proves HAK v4 prepares the exact
        # serial-only approve/revoke/approved-transfer transactions without
        # loading a private key or submitting them. This remains CI/LOCAL; the
        # external wallet signature/broadcast step is intentionally out-of-band.
        run: npm run hedera:delegated-recovery-hak-check

      - name: Hedera BookingRight delegation policy + replay check
        # ETHOnline-new HAK v4 AbstractPolicy behavior. This stays CI/LOCAL: it
        # proves policy gating and durable nonce semantics before transaction
        # preparation, but does not claim a network-side policy primitive.
        run: npm run hedera:booking-policy-check

      - name: Independent SEC-HEDERA-007 allowedActions retest
        run: node --no-warnings --experimental-transform-types scripts/security/hedera-usdc-allowed-actions-retest.mjs

      - name: Continuity baseline must remain documented
        run: |
          grep -q 'd0b5f875afb4f2b29af29bc5972cf1edc404d473' docs/ethonline-2026/CONTINUITY_BASELINE.md
          test -f docs/ethonline-2026/ACCEPTANCE.json
          test -f docs/ethonline-2026/progress.md
